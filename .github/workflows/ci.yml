# ─────────────────────────────────────────────────────────────────────────────
# CI Pipeline — AI Finance & Compliance Copilot
#
# Runs on every push and pull request to main.
# Gates: typecheck → lint → test → build
# All four must pass; any failure blocks the merge.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js setup ─────────────────────────────────────────────────────
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Typecheck ─────────────────────────────────────────────────────────
      # Catches TypeScript errors before running tests.
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      # ── 5. Lint ───────────────────────────────────────────────────────────────
      # Enforces code quality rules. Failures block the build.
      - name: Lint (next lint)
        run: npm run lint

      # ── 6. Tests ─────────────────────────────────────────────────────────────
      # Runs the full test suite using the embedded PGlite database.
      # No external DB or secrets required — app auto-falls back to PGlite.
      - name: Run tests
        run: npm test
        env:
          # Use test environment so logger is silent and no .env.local required
          NODE_ENV: test

      # ── 7. Production build ───────────────────────────────────────────────────
      # Verifies the app compiles successfully with zero type errors.
      # GEMINI_API_KEY is intentionally left unset — build must not require it.
      - name: Production build (next build)
        run: npm run build
        env:
          NODE_ENV: production
          # SESSION_SECRET required in production — use a dummy value for build verification only.
          # This is NOT a real secret; real secrets are injected by the hosting platform.
          SESSION_SECRET: ci-build-verification-dummy-secret-not-used-at-runtime

  # ─────────────────────────────────────────────────────────────────────────────
  # Second job: run the full test suite against real PostgreSQL 16
  # Purpose: surface behavioural differences between PGlite and real Postgres
  # before they compound across later phases.
  # ─────────────────────────────────────────────────────────────────────────────
  test-postgres:
    name: Test suite · PostgreSQL 16
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: copilot_test
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot_test_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run migrations against ephemeral Postgres
        run: npm run db:migrate
        env:
          # Connects to the service container above.
          # NOTE: The Postgres service container does NOT use TLS; the
          # connection string uses ?sslmode=disable so the runner can
          # talk to it. Real production DATABASE_URL must use sslmode=verify-full
          # (enforced by rejectUnauthorized:true in db.ts).
          DATABASE_URL: postgresql://copilot:copilot_test_pw@localhost:5432/copilot_test?sslmode=disable

      - name: Run full test suite against PostgreSQL 16
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://copilot:copilot_test_pw@localhost:5432/copilot_test?sslmode=disable

