# ─────────────────────────────────────────────────────────────────────────────
# CI Pipeline — AI Finance & Compliance Copilot
#
# Runs on every push and pull request to main.
# Gates: typecheck → lint → test (PGlite & Real PostgreSQL 16) → build
# All steps must pass; any failure blocks the merge.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck · Lint · Test (PGlite & Postgres 16) · Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js setup ─────────────────────────────────────────────────────
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Typecheck ─────────────────────────────────────────────────────────
      # Catches TypeScript errors before running tests.
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      # ── 5. Lint ───────────────────────────────────────────────────────────────
      # Enforces code quality rules. Failures block the build.
      - name: Lint (next lint)
        run: npm run lint

      # ── 6. Tests (Embedded PGlite engine) ────────────────────────────────────
      # Runs the full test suite using embedded PGlite database.
      - name: Run tests (PGlite Engine)
        run: npm test
        env:
          NODE_ENV: test

      # ── 7. Tests (Network-attached PostgreSQL 16 engine) ─────────────────────
      # Runs the full test suite against real PostgreSQL container via DATABASE_URL.
      - name: Run tests (Real PostgreSQL 16 Engine)
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://testuser:testpassword@localhost:5432/testdb?sslmode=disable

      # ── 8. Production build ───────────────────────────────────────────────────
      # Verifies the app compiles successfully with zero type errors.
      # GEMINI_API_KEY is intentionally left unset — build must not require it.
      - name: Production build (next build)
        run: npm run build
        env:
          NODE_ENV: production
          # SESSION_SECRET required in production — use a dummy value for build verification only.
          # This is NOT a real secret; real secrets are injected by the hosting platform.
          SESSION_SECRET: ci-build-verification-dummy-secret-not-used-at-runtime
